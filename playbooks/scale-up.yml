---
- name: Validate scale-up inputs
  hosts: k8s_cluster
  gather_facts: true
  any_errors_fatal: true
  environment: &proxy_environment
    http_proxy: "{{ proxy_env.http_proxy | default(proxy_env.HTTP_PROXY | default('')) }}"
    https_proxy: "{{ proxy_env.https_proxy | default(proxy_env.HTTPS_PROXY | default('')) }}"
    no_proxy: "{{ proxy_env.no_proxy | default(proxy_env.NO_PROXY | default('')) }}"
    HTTP_PROXY: "{{ proxy_env.HTTP_PROXY | default(proxy_env.http_proxy | default('')) }}"
    HTTPS_PROXY: "{{ proxy_env.HTTPS_PROXY | default(proxy_env.https_proxy | default('')) }}"
    NO_PROXY: "{{ proxy_env.NO_PROXY | default(proxy_env.no_proxy | default('')) }}"
  roles:
    - role: preflight
      tags:
        - preflight

- name: Prepare scale-up nodes
  hosts: k8s_cluster
  gather_facts: true
  any_errors_fatal: true
  environment: *proxy_environment
  roles:
    - role: os_prepare
      tags:
        - os
        - prepare

- name: Configure apiserver load balancer for scale-up
  hosts: kube_control_plane
  gather_facts: true
  any_errors_fatal: true
  environment: *proxy_environment
  roles:
    - role: apiserver_lb
      tags:
        - lb
        - apiserver-lb
        - haproxy
        - keepalived

- name: Install and configure runtime on scale-up nodes
  hosts: k8s_cluster
  gather_facts: true
  any_errors_fatal: true
  environment: *proxy_environment
  roles:
    - role: containerd
      tags:
        - runtime
        - containerd

- name: Install Kubernetes packages on scale-up nodes
  hosts: k8s_cluster
  gather_facts: true
  any_errors_fatal: true
  environment: *proxy_environment
  roles:
    - role: kubernetes_repo
      tags:
        - repo
        - packages
    - role: kubernetes_packages
      tags:
        - packages

- name: Join new control-plane nodes
  hosts: kube_control_plane
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  environment: *proxy_environment
  roles:
    - role: kubeadm_control_plane
      tags:
        - kubeadm
        - control-plane
        - master

- name: Join new worker nodes
  hosts: kube_node
  gather_facts: true
  any_errors_fatal: true
  environment: *proxy_environment
  roles:
    - role: kubeadm_workers
      tags:
        - kubeadm
        - workers
        - worker
