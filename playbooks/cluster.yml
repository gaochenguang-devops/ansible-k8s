---
- name: Validate Kubernetes cluster inputs
  hosts: k8s_cluster
  gather_facts: true
  any_errors_fatal: true
  environment: &proxy_environment
    http_proxy: "{{ proxy_env.http_proxy | default(proxy_env.HTTP_PROXY | default('')) }}"
    https_proxy: "{{ proxy_env.https_proxy | default(proxy_env.HTTPS_PROXY | default('')) }}"
    no_proxy: "{{ proxy_env.no_proxy | default(proxy_env.NO_PROXY | default('')) }}"
    HTTP_PROXY: "{{ proxy_env.HTTP_PROXY | default(proxy_env.http_proxy | default('')) }}"
    HTTPS_PROXY: "{{ proxy_env.HTTPS_PROXY | default(proxy_env.https_proxy | default('')) }}"
    NO_PROXY: "{{ proxy_env.NO_PROXY | default(proxy_env.no_proxy | default('')) }}"
  pre_tasks:
    - name: Clear resume checkpoints when requested
      ansible.builtin.include_role:
        name: resume
        tasks_from: clear
      when:
        - resume_enabled | bool
        - resume_reset_state | bool
      tags:
        - always

    - name: Check preflight resume checkpoint
      ansible.builtin.include_role:
        name: resume
        tasks_from: check
      vars:
        resume_current_stage: preflight
      tags:
        - preflight
  roles:
    - role: preflight
      when: not (resume_stage_done | default(false) | bool)
      tags:
        - preflight
  post_tasks:
    - name: Mark preflight resume checkpoint
      ansible.builtin.include_role:
        name: resume
        tasks_from: mark
      vars:
        resume_current_stage: preflight
      when:
        - resume_enabled | bool
        - not (resume_stage_done | default(false) | bool)
      tags:
        - preflight

