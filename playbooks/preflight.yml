---
- name: Validate Kubernetes cluster inputs
  hosts: k8s_cluster
  gather_facts: true
  any_errors_fatal: true
  environment:
    http_proxy: "{{ proxy_env.http_proxy | default(proxy_env.HTTP_PROXY | default('')) }}"
    https_proxy: "{{ proxy_env.https_proxy | default(proxy_env.HTTPS_PROXY | default('')) }}"
    no_proxy: "{{ proxy_env.no_proxy | default(proxy_env.NO_PROXY | default('')) }}"
    HTTP_PROXY: "{{ proxy_env.HTTP_PROXY | default(proxy_env.http_proxy | default('')) }}"
    HTTPS_PROXY: "{{ proxy_env.HTTPS_PROXY | default(proxy_env.https_proxy | default('')) }}"
    NO_PROXY: "{{ proxy_env.NO_PROXY | default(proxy_env.no_proxy | default('')) }}"
  roles:
    - role: preflight
      tags:
        - preflight
