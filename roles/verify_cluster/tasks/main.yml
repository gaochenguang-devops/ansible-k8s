---
- name: Verify Kubernetes API readiness
  ansible.builtin.command: "kubectl --kubeconfig {{ kubeconfig_path }} get --raw=/readyz"
  register: verify_api_ready
  changed_when: false
  retries: 30
  delay: 5
  until: verify_api_ready.rc == 0

- name: Wait for all nodes to be Ready
  ansible.builtin.command: "kubectl --kubeconfig {{ kubeconfig_path }} wait --for=condition=Ready nodes --all --timeout={{ verify_node_ready_timeout }}"
  changed_when: false

- name: Wait for CoreDNS rollout
  ansible.builtin.command: "kubectl --kubeconfig {{ kubeconfig_path }} -n kube-system rollout status deployment/coredns --timeout={{ verify_system_rollout_timeout }}"
  changed_when: false

- name: Wait for Calico daemonset
  ansible.builtin.command: "kubectl --kubeconfig {{ kubeconfig_path }} -n kube-system rollout status daemonset/calico-node --timeout={{ verify_system_rollout_timeout }}"
  changed_when: false
  when: cni_plugin == 'calico'

- name: Wait for Flannel daemonset
  ansible.builtin.command: "kubectl --kubeconfig {{ kubeconfig_path }} -n kube-flannel rollout status daemonset/kube-flannel-ds --timeout={{ verify_system_rollout_timeout }}"
  changed_when: false
  when: cni_plugin == 'flannel'

- name: Wait for Cilium daemonset
  ansible.builtin.command: "kubectl --kubeconfig {{ kubeconfig_path }} -n kube-system rollout status daemonset/cilium --timeout={{ verify_system_rollout_timeout }}"
  changed_when: false
  when: cni_plugin == 'cilium'

- name: Show node summary
  ansible.builtin.command: "kubectl --kubeconfig {{ kubeconfig_path }} get nodes -o wide"
  register: verify_nodes
  changed_when: false

- name: Print node summary
  ansible.builtin.debug:
    var: verify_nodes.stdout_lines

- name: Show system pod summary
  ansible.builtin.command: "kubectl --kubeconfig {{ kubeconfig_path }} get pods -A -o wide"
  register: verify_pods
  changed_when: false

- name: Print system pod summary
  ansible.builtin.debug:
    var: verify_pods.stdout_lines
