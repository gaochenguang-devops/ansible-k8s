---
- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Install base packages on Debian family
  ansible.builtin.apt:
    name: "{{ common_packages_debian }}"
    state: present
  when: ansible_os_family == 'Debian'

- name: Install base packages on RedHat family
  ansible.builtin.package:
    name: "{{ common_packages_redhat }}"
    state: present
  when: ansible_os_family == 'RedHat'

- name: Read current timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: current_timezone
  changed_when: false
  when: system_timezone | length > 0

- name: Set timezone when requested
  ansible.builtin.command: "timedatectl set-timezone {{ system_timezone }}"
  when:
    - system_timezone | length > 0
    - current_timezone.stdout != system_timezone

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: ansible_swaptotal_mb | int > 0
  when:
    - disable_swap | bool
    - ansible_swaptotal_mb | int > 0

- name: Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'
  when: disable_swap | bool

- name: Persist kernel modules for Kubernetes
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load overlay module
  ansible.builtin.command: modprobe overlay
  changed_when: false

- name: Load br_netfilter module
  ansible.builtin.command: modprobe br_netfilter
  changed_when: false

- name: Configure Kubernetes sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: Apply Kubernetes sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Put SELinux in permissive mode immediately
  ansible.builtin.command: setenforce 0
  changed_when: true
  failed_when: false
  when:
    - manage_selinux | bool
    - ansible_os_family == 'RedHat'
    - ansible_selinux is defined
    - ansible_selinux.status == 'enabled'
    - ansible_selinux.mode != 'permissive'

- name: Persist SELinux permissive mode
  ansible.builtin.replace:
    path: /etc/selinux/config
    regexp: '^SELINUX=.*'
    replace: 'SELINUX=permissive'
  when:
    - manage_selinux | bool
    - ansible_os_family == 'RedHat'
    - ansible_selinux is defined
    - ansible_selinux.status == 'enabled'

- name: Gather service facts
  ansible.builtin.service_facts:
  when: disable_firewalld | bool

- name: Disable firewalld when installed
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  when:
    - disable_firewalld | bool
    - ansible_facts.services is defined
    - "'firewalld.service' in ansible_facts.services"

- name: Set hostname from inventory
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  when: manage_hostname | bool

- name: Build cluster hosts block
  ansible.builtin.set_fact:
    cluster_hosts_block: |-
      {% for host in groups['k8s_cluster'] %}
      {{ hostvars[host].node_ip | default(hostvars[host].ansible_host | default(host)) }} {{ host }}
      {% endfor %}
      {% if apiserver_lb_enabled | bool and kube_control_plane_vip | length > 0 %}
      {{ kube_control_plane_vip }} {{ cluster_name }}-api
      {% endif %}
  when: manage_etc_hosts | bool

- name: Maintain cluster hosts entries
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED K8S CLUSTER HOSTS"
    block: "{{ cluster_hosts_block }}"
    state: present
  when: manage_etc_hosts | bool
