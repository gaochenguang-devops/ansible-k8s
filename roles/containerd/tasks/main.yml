---
- name: Set containerd package name
  ansible.builtin.set_fact:
    containerd_use_upstream_repo: "{{ containerd_manage_upstream_repo | bool and (ansible_distribution in ['Ubuntu', 'Debian'] or (ansible_os_family == 'RedHat' and ansible_distribution | lower != 'openeuler')) }}"

- name: Set effective containerd package
  ansible.builtin.set_fact:
    containerd_effective_package: "{{ 'containerd.io' if containerd_use_upstream_repo | bool else 'containerd' }}"

- name: Ensure apt keyring directory exists for Docker repository
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when:
    - ansible_distribution in ['Ubuntu', 'Debian']
    - containerd_use_upstream_repo | bool

- name: Download Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_gpg_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when:
    - ansible_distribution in ['Ubuntu', 'Debian']
    - containerd_use_upstream_repo | bool

- name: Configure Docker apt repository for containerd.io
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    mode: "0644"
    content: |
      deb [arch={{ arch_map[ansible_architecture] }} signed-by=/etc/apt/keyrings/docker.asc] {{ docker_apt_repo_url }} {{ docker_apt_codename }} stable
  when:
    - ansible_distribution in ['Ubuntu', 'Debian']
    - containerd_use_upstream_repo | bool

- name: Refresh apt cache for Docker repository
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_distribution in ['Ubuntu', 'Debian']
    - containerd_use_upstream_repo | bool

- name: Configure Docker CE repository for containerd.io
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable
    baseurl: "{{ docker_rpm_repo_url }}"
    enabled: true
    gpgcheck: true
    gpgkey: "{{ docker_rpm_gpg_key_url }}"
  when:
    - ansible_os_family == 'RedHat'
    - containerd_use_upstream_repo | bool

- name: Install containerd package
  ansible.builtin.package:
    name: "{{ containerd_effective_package }}{{ '-' + containerd_package_version if (containerd_package_version | length > 0 and ansible_os_family == 'RedHat') else '' }}"
    state: present
  when: not (ansible_os_family == 'Debian' and containerd_package_version | length > 0)

- name: Install exact containerd package on Debian family when requested
  ansible.builtin.apt:
    name: "{{ containerd_effective_package }}={{ containerd_package_version }}"
    state: present
    allow_downgrade: true
  when:
    - ansible_os_family == 'Debian'
    - containerd_package_version | length > 0

- name: Ensure containerd configuration directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Configure containerd for Kubernetes
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    mode: "0644"
  notify: Restart containerd

- name: Configure crictl endpoint
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    mode: "0644"
    content: |
      runtime-endpoint: {{ cri_socket }}
      image-endpoint: {{ cri_socket }}
      timeout: 10
      debug: false

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
    daemon_reload: true
